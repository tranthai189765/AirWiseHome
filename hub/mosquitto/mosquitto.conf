# Mosquitto trên hub (bản demo Checkpoint 1)
# Chỉ dùng cho demo: không TLS, cho phép kết nối ẩn danh.
# Bản thật: listener 8883 + TLS, password_file và acl_file (mỗi node một tài khoản, chỉ ghi chủ đề của mình).
listener 1883
allow_anonymous true
persistence false
log_dest stdout

# Wokwi không truy cập được mạng LAN của hub nên bản demo bridge với một broker công cộng:
# ESP32 (Wokwi) -> broker.hivemq.com -> bridge -> Mosquitto trên hub. Với thiết bị thật, ESP32 kết nối
# thẳng tới broker này qua Wi-Fi nội bộ và phần bridge được bỏ đi.
connection wokwi-bridge
address broker.hivemq.com:1883
# Tách chiều: bản tin của thiết bị chỉ đi vào (in), lệnh của hub chỉ đi ra (out). Để "both" thì broker
# công cộng gửi lệnh của hub ngược về (thấy mỗi lệnh 2 lần) và ai cũng có thể đẩy lệnh vào hub.
topic airwise/n6h01/+/telemetry in 1
topic airwise/n6h01/+/state in 1
topic airwise/n6h01/+/status in 1
topic airwise/n6h01/+/meta in 1
topic airwise/n6h01/+/cmd/ack in 1
topic airwise/n6h01/+/cmd out 1
remote_clientid airwise-n6h01-hub-bridge
cleansession true
# broker công cộng không nhận cờ "bridge" riêng của Mosquitto
try_private false
bridge_protocol_version mqttv311
# không gửi thông báo trạng thái bridge lên chủ đề $SYS (broker công cộng chặn)
notifications false
